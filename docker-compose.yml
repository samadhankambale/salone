services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon_pass
      POSTGRES_DB: salon_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://salon:salon_pass@db:5432/salon_db
      GROQ_API_KEY: ${GROQ_API_KEY}
      PORT: 8000
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    environment:
      DATABASE_URL: postgresql://salon:salon_pass@db:5432/salon_db
      GROQ_API_KEY: ${GROQ_API_KEY}
      BACKEND_URL: http://backend:8000
      PORT: 8501
    ports:
      - "8501:8501"

volumes:
  db_data:
